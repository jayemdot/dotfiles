# kitty — hand-maintained behavior settings.
#
# Appearance (font, cursor, opacity, colors) is NOT set here: it is generated
# from terminal/theme.toml (shared with iTerm2) into appearance.conf and the
# {dark,light,no-preference}-theme.auto.conf files, which kitty switches
# between automatically with the macOS appearance. Edit theme.toml instead.
include appearance.conf

# --- Behavior parity with the previous iTerm2 profile -------------------------
# Option types macOS special characters (as in iTerm2: "Option Key Sends: Normal").
macos_option_as_alt no
scrollback_lines    10000
enable_audio_bell   no
window_padding_width 2

# tmux owns tabs and splits; kitty's tab bar only appears with 2+ kitty tabs.
tab_bar_min_tabs 2
# tmux keeps sessions alive, so closing the window loses nothing.
confirm_os_window_close 0
macos_quit_when_last_window_closed yes

# OSC 52: programs may write the clipboard (tmux copy-mode, bin/clip-copy over
# SSH), but reading it back requires confirmation.
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
