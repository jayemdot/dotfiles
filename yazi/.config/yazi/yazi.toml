[mgr]
ratio = [0, 1, 2]
show_hidden = true

[preview]
# Built-in pdf/image previewers rasterize up to these pixel bounds, and yazi
# never upscales — so the defaults (600x900) look small in a wide pane.
# Bump them so PDF pages fill the preview pane. Run `yazi --clear-cache` after
# changing these.
# Retina iTerm2 panes are large in physical pixels, so render generously.
# If a PDF page still doesn't fill the pane, raise these further; if page
# turns feel slow, lower them. (max_height is the binding dim for portrait PDFs.)
max_width    = 2000
max_height   = 2800
image_filter = "lanczos3"
image_quality = 90

[plugin]
prepend_previewers = [
  # Render Markdown with glow; everything else text/* falls through to bat.
  { url = "*.md",       run = "glow" },
  { url = "*.markdown", run = "glow" },
  { mime = "text/*",    run = "bat"  },
]

# git.yazi: compute git status for files/dirs (rendered as signs in the list).
prepend_fetchers = [
  { url = "*",  run = "git", group = "git" },
  { url = "*/", run = "git", group = "git" },
]

[opener]
# Enter on a PDF opens it in Google Chrome (zoom, page navigation, search).
# Selected files are passed with `%s` (all) / `%s1` (first). yazi runs
# `sh -c <run>` with NO positional args, so the old "$@" form silently expands
# to nothing — that is why the previous iTerm2-browser opener stopped working.
pdf = [
  { run = 'open -a "Google Chrome" %s', desc = "Google Chrome", for = "macos" },
  { run = "xdg-open %s1",                desc = "Open",          for = "linux", orphan = true },
]

[open]
prepend_rules = [
  { mime = "application/pdf", use = "pdf" },
]
