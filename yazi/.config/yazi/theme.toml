# Monokai theme for Yazi — palette from dotfiles/vim/.vim/colors/monokai.vim
#
#   s:black      #272822   s:white     #E8E8E3
#   s:darkblack  #211F1C   s:lightblack #2D2E27
#   s:lightgrey  #575b61   s:warmgrey  #75715E
#   s:grey       #8F908A
#   s:pink       #F92772   s:green     #A6E22D
#   s:aqua       #66D9EF   s:yellow    #E6DB74
#   s:orange     #FD9720   s:purple    #AE81FF
#
# Section/key names follow yazi 26.9 (yazi-config/src/theme/theme.rs). Unknown
# sections are NOT an error — yazi silently swallows them as "custom" sections
# (that's how plugin sections like [git] work) — so a stale name like the old
# [manager] fails silently. Check theme.rs after major yazi upgrades.

[mgr]
# Path in blue + branch (init.lua) in yellow, matching the zsh prompt / Claude
# Code statusline (%F{blue} path, %F{yellow} branch).
cwd = { fg = "blue", bold = true }

find_keyword  = { fg = "#E6DB74", bold = true, italic = true }
find_position = { fg = "#F92772", bold = true }

symlink_target = { fg = "#66D9EF", italic = true }

marker_copied   = { fg = "#A6E22D", bg = "#A6E22D" }
marker_cut      = { fg = "#F92772", bg = "#F92772" }
marker_marked   = { fg = "#66D9EF", bg = "#66D9EF" }
marker_selected = { fg = "#E6DB74", bg = "#E6DB74" }

count_copied   = { fg = "#211F1C", bg = "#A6E22D", bold = true }
count_cut      = { fg = "#211F1C", bg = "#F92772", bold = true }
count_selected = { fg = "#211F1C", bg = "#E6DB74", bold = true }

border_symbol = "│"
border_style  = { fg = "#575b61" }

# TabLineSel: fg=darkblack bg=warmgrey bold / TabLine: fg=lightgrey
[tabs]
active    = { fg = "#211F1C", bg = "#75715E", bold = true }
inactive  = { fg = "#575b61" }
# Flat tabs — no powerline glyphs (upstream default uses them).
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

# Status-bar mode block: *_main = mode label, *_alt = the segment beside it.
[mode]
normal_main = { fg = "#211F1C", bg = "#A6E22D", bold = true }
normal_alt  = { fg = "#A6E22D", bg = "#2D2E27" }
select_main = { fg = "#211F1C", bg = "#66D9EF", bold = true }
select_alt  = { fg = "#66D9EF", bg = "#2D2E27" }
unset_main  = { fg = "#211F1C", bg = "#FD9720", bold = true }
unset_alt   = { fg = "#FD9720", bg = "#2D2E27" }

# Hovered row in each pane (was [manager] hovered / preview_hovered).
[indicator]
parent  = { fg = "#E8E8E3", bg = "#2D2E27" }
current = { fg = "#211F1C", bg = "#A6E22D", bold = true }
preview = { underline = true }
padding = { open = "", close = "" }

[status]
# Flat status bar — no powerline glyphs.
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# perm: type=aqua read=yellow write=pink exec=green sep=warmgrey
perm_type  = { fg = "#66D9EF" }
perm_read  = { fg = "#E6DB74" }
perm_write = { fg = "#F92772" }
perm_exec  = { fg = "#A6E22D" }
perm_sep   = { fg = "#75715E" }

progress_label  = { fg = "#E8E8E3", bold = true }
progress_normal = { fg = "#66D9EF", bg = "#272822" }
progress_error  = { fg = "#F92772", bg = "#272822" }

[which]
border          = { fg = "#FD9720" }
mask            = { bg = "#272822" }
cand            = { fg = "#66D9EF" }
rest            = { fg = "#75715E" }
desc            = { fg = "#AE81FF" }
separator_style = { fg = "#2D2E27" }

[confirm]
border     = { fg = "#FD9720" }
title      = { fg = "#E8E8E3", bold = true }
body       = { fg = "#E8E8E3" }
list       = { fg = "#E6DB74" }
btn_yes    = { fg = "#211F1C", bg = "#A6E22D", bold = true }
btn_no     = { fg = "#75715E" }

[spot]
border   = { fg = "#FD9720" }
title    = { fg = "#E8E8E3", bold = true }
tbl_col  = { fg = "#66D9EF" }
tbl_cell = { fg = "#211F1C", bg = "#E6DB74" }

[notify]
title_info  = { fg = "#A6E22D" }
title_warn  = { fg = "#FD9720" }
title_error = { fg = "#F92772" }

# Was [select] (renamed to [pick]).
[pick]
border   = { fg = "#FD9720" }
active   = { fg = "#A6E22D", bold = true }
inactive = { fg = "#75715E" }

[input]
border   = { fg = "#FD9720" }
title    = { fg = "#E8E8E3", bold = true }
value    = { fg = "#E8E8E3" }
selected = { fg = "#211F1C", bg = "#FD9720" }

[cmp]
border   = { fg = "#FD9720" }
active   = { fg = "#211F1C", bg = "#66D9EF" }
inactive = { fg = "#E8E8E3" }

[tasks]
border  = { fg = "#FD9720" }
title   = { fg = "#E8E8E3", bold = true }
hovered = { fg = "#66D9EF", underline = true }

# Was on/exec (renamed to chord/action); desc/footer no longer exist.
[help]
border  = { fg = "#FD9720" }
chord   = { fg = "#AE81FF", bold = true }
action  = { fg = "#66D9EF" }
hovered = { fg = "#E8E8E3", bg = "#2D2E27", bold = true }

# git.yazi status signs, VSCode-style letters + Monokai colors:
#   U untracked/new (green)   M unstaged (orange) / staged (green)   A added (green)
#   D deleted (pink)          ! conflict (pink)     ignored hidden
[git]
untracked = { fg = "#A6E22D" }
added     = { fg = "#A6E22D" }
unstaged  = { fg = "#FD9720" }
staged    = { fg = "#A6E22D" }
updated   = { fg = "#F92772", bold = true }
deleted   = { fg = "#F92772" }
ignored   = { fg = "#75715E" }

untracked_sign = "U"
added_sign     = "A"
unstaged_sign  = "M"
staged_sign    = "M"
updated_sign   = "!"
deleted_sign   = "D"
ignored_sign   = ""

[filetype]
rules = [
  # Directory — s:aqua (Directory highlight in vim)
  { mime = "inode/directory",   fg = "#66D9EF", bold = true },
  # Executable — s:green
  { mime = "application/x-executable",  fg = "#A6E22D", bold = true },
  { mime = "application/x-mach-binary", fg = "#A6E22D", bold = true },
  # Image — s:yellow
  { mime = "image/*",           fg = "#E6DB74" },
  # Video / Audio — s:purple
  { mime = "video/*",           fg = "#AE81FF" },
  { mime = "audio/*",           fg = "#AE81FF" },
  # Archive — s:pink
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,lzo,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#F92772" },
  { mime = "application/x-{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,lzo,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#F92772" },
  # Document — s:orange
  { mime = "application/pdf",   fg = "#FD9720" },
  { mime = "application/{doc,rtf,vnd.*}", fg = "#FD9720" },
  # Symlink — s:aqua italic
  { mime = "inode/symlink",     fg = "#66D9EF", italic = true },
  # Empty — s:warmgrey
  { mime = "inode/x-empty",    fg = "#75715E" },
  # Text — s:white
  { mime = "text/*",            fg = "#E8E8E3" },
]
