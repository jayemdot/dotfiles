set -g prefix C-\\
set -g prefix2 C-¥
set -g mouse on
set -g focus-events on
set -s extended-keys on
set -g allow-passthrough on
# image.nvim (kitty graphics in nvim through tmux) also needs these.
set -g visual-activity off
# NOTE: do NOT propagate TERM via update-environment. tmux sets TERM per-pane
# from default-terminal (tmux-256color); copying the client's xterm-256color in
# here leaks the wrong TERM into programs run inside tmux (incl. the claude CLI,
# via the claude() wrapper's `eval $(tmux show-environment -s)`).
set -ga update-environment TERM_PROGRAM
# Active-pane background is generated from terminal/theme.toml (shared with
# kitty / iTerm2) so the color is defined in exactly one place.
source-file ~/.tmux/theme.conf
setw -g mode-keys vi
# Copy selection via clip-copy (bin package): pbcopy on macOS; on Ubuntu/WSL it
# routes to the outer terminal's clipboard (OSC 52) / clip.exe / X11 tools.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "~/.local/bin/clip-copy"
# Nested tmux (SSH from inside local tmux into a box that auto-starts tmux):
# prefix + C-\ forwards the prefix to the inner tmux.
bind C-\\ send-prefix
bind r source-file ~/.tmux.conf \; display "りろーど！"

# Propagate VS Code / Claude Code env vars on reattach so the IDE integration
# picks up the current VS Code window's SSE port.
set-option -ga update-environment " CLAUDE_CODE_SSE_PORT CLAUDECODE TERM_PROGRAM VSCODE_IPC_HOOK_CLI VSCODE_GIT_IPC_HANDLE VSCODE_GIT_ASKPASS_NODE VSCODE_GIT_ASKPASS_EXTRA_ARGS VSCODE_GIT_ASKPASS_MAIN VSCODE_INJECTION"

# Status bar: free disk space (macOS boot volume) + date/time on the right.
set -g status-right-length 50
set -g status-right ' #(~/.local/bin/tmux-disk-free) free  %Y-%m-%d %H:%M '

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
# After each save, keep only the newest 10 resurrect files (older ones pruned).
# The prune script bails out if the latest save looks incomplete, so a failed
# save never deletes older good backups.
set -g @resurrect-hook-post-save-all '~/.local/bin/tmux-resurrect-prune'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
